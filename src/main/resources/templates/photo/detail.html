<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${photo.title}">사진 상세</title>
    <link rel="stylesheet" th:href="@{/css/photo-style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container">
    <article class="detail-card">
        <img class="detail-image"
             th:src="@{/uploads/{fileName}(fileName=${photo.savedName})}"
             alt="사진 이미지">

        <div class="detail-body">
            <h1 class="detail-title" th:text="${photo.title}">사진 제목</h1>

            <div class="photo-meta">
                <span th:text="|작성자: ${photo.writerName}|">작성자</span>
                <span th:text="|작성일: ${#temporals.format(photo.createdAt, 'yyyy-MM-dd HH:mm')}|">작성일</span>
                <span th:if="${photo.updatedAt != null}"
                      th:text="|수정일: ${#temporals.format(photo.updatedAt, 'yyyy-MM-dd HH:mm')}|">
                    수정일
                </span>
            </div>

            <div class="detail-content" th:text="${photo.content}">
                사진 설명 내용
            </div>

            <div class="detail-actions">
                <a href="/photos" class="btn btn-outline">목록</a>

                <!-- 본인 또는 관리자: 수정 가능 -->
                <a sec:authorize="isAuthenticated()"
                   th:if="${#authentication.name == photo.writer or #authorization.expression('hasRole(''ADMIN'')')}"
                   th:href="@{/photos/{id}/edit(id=${photo.id})}"
                   class="btn btn-warning">
                    수정
                </a>

                <!-- 비회원: 수정 클릭 시 로그인 안내 -->
                <button sec:authorize="isAnonymous()"
                        type="button"
                        class="btn btn-warning"
                        onclick="needLogin()">
                    수정
                </button>

                <!-- 회원이지만 본인 글 아님: 권한 없음 -->
                <button sec:authorize="isAuthenticated()"
                        th:if="${#authentication.name != photo.writer and !#authorization.expression('hasRole(''ADMIN'')')}"
                        type="button"
                        class="btn btn-warning"
                        onclick="noPermission()">
                    수정
                </button>

                <!-- 본인 또는 관리자: 소프트 삭제 -->
                <form sec:authorize="isAuthenticated()"
                      th:if="${#authentication.name == photo.writer or #authorization.expression('hasRole(''ADMIN'')')}"
                      th:action="@{/photos/{id}/delete(id=${photo.id})}"
                      method="post"
                      onsubmit="return confirm('이 글을 삭제 처리하시겠습니까?');">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>

                <!-- 비회원 삭제 -->
                <button sec:authorize="isAnonymous()"
                        type="button"
                        class="btn btn-danger"
                        onclick="needLogin()">
                    삭제
                </button>

                <!-- 회원이지만 본인 글 아님 -->
                <button sec:authorize="isAuthenticated()"
                        th:if="${#authentication.name != photo.writer and !#authorization.expression('hasRole(''ADMIN'')')}"
                        type="button"
                        class="btn btn-danger"
                        onclick="noPermission()">
                    삭제
                </button>
            </div>

            <!-- 관리자 전용 기능 -->
            <section sec:authorize="hasRole('ADMIN')" class="admin-zone">
                <h3>관리자 전용 관리</h3>

                <div class="detail-actions">
                    <!-- 관리자 실제 DB 삭제 -->
                    <form th:action="@{/admin/photos/{id}/hard-delete(id=${photo.id})}"
                          method="post"
                          onsubmit="return confirm('DB에서 실제 삭제됩니다. 계속하시겠습니까?');">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-danger">
                            실제 삭제
                        </button>
                    </form>

                    <!-- 관리자 소프트 삭제 -->
                    <form th:action="@{/admin/photos/{id}/soft-delete(id=${photo.id})}"
                          method="post"
                          onsubmit="return confirm('관리자 권한으로 소프트 삭제하시겠습니까?');">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-outline">
                            관리자 소프트 삭제
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </article>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    function needLogin() {
        alert("로그인이 필요한 기능입니다.");
        location.href = "/login";
    }

    function noPermission() {
        alert("권한이 없습니다. 본인이 작성한 글만 수정하거나 삭제할 수 있습니다.");
    }
</script>

</body>
</html>
