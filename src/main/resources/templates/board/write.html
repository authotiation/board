<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>게시글 등록</title>
    <link rel="stylesheet" th:href="@{/css/photo-style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container">
    <!-- 비회원이 직접 URL 접근했을 때 안내 -->
    <section sec:authorize="isAnonymous()" class="form-card">
        <h2>로그인 후 이용할 수 있어요</h2>
        <p style="text-align:center; color:#6b7280;">
            글을 등록하려면 먼저 로그인해주세요.
        </p>
        <div class="form-actions">
            <a href="/login" class="btn btn-primary">로그인</a>
            <a href="/boards" class="btn btn-outline">목록으로</a>
        </div>
    </section>

    <!-- 회원만 작성 폼 표시 -->
    <section sec:authorize="isAuthenticated()" class="form-card">
        <h2>게시글 등록</h2>

        <form th:action="@{/boards/write}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label for="title">제목</label>
                <input type="text"
                       id="title"
                       name="title"
                       placeholder="제목을 입력하세요"
                       required>
            </div>

            <div class="form-group">
                <label for="content">내용</label>
                <textarea id="content"
                          name="content"
                          placeholder="내용을 입력하세요"
                          required></textarea>
            </div>

            <div class="form-group">
                <label for="file">이미지 파일</label>
                <input type="file"
                       id="file"
                       name="file"
                       accept="image/*"
                       required>
            </div>

            <div class="form-actions">
                <a href="/boards" class="btn btn-outline">취소</a>
                <button type="submit" class="btn btn-primary">등록</button>
            </div>
        </form>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
