<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>사진글 수정</title>
    <link rel="stylesheet" th:href="@{/css/photo-style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container">

    <!-- 비회원 접근 -->
    <section sec:authorize="isAnonymous()" class="form-card">
        <h2>로그인이 필요합니다</h2>
        <p style="text-align:center; color:#6b7280;">
            사진글을 수정하려면 먼저 로그인해야 합니다.
        </p>
        <div class="form-actions">
            <a href="/login" class="btn btn-primary">로그인</a>
            <a th:href="@{/photos/{id}(id=${photo.id})}" class="btn btn-outline">상세로</a>
        </div>
    </section>

    <!-- 로그인했지만 권한 없음 -->
    <section sec:authorize="isAuthenticated()"
             th:if="${#authentication.name != photo.writer and !#authorization.expression('hasRole(''ADMIN'')')}"
             class="form-card">
        <h2>수정할 수 없는 글입니다</h2>
        <p style="text-align:center; color:#6b7280;">
            이 글은 작성자만 수정할 수 있어요.
        </p>
        <div class="form-actions">
            <a th:href="@{/photos/{id}(id=${photo.id})}" class="btn btn-outline">상세로</a>
            <a href="/photos" class="btn btn-primary">목록으로</a>
        </div>
    </section>

    <!-- 본인 또는 관리자만 수정 폼 표시 -->
    <section sec:authorize="isAuthenticated()"
             th:if="${#authentication.name == photo.writer or #authorization.expression('hasRole(''ADMIN'')')}"
             class="form-card">

        <h2>사진글 수정</h2>

        <form th:action="@{/photos/{id}/edit(id=${photo.id})}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label for="title">제목</label>
                <input type="text"
                       id="title"
                       name="title"
                       th:value="${photo.title}"
                       required>
            </div>

            <div class="form-group">
                <label for="content">내용</label>
                <textarea id="content"
                          name="content"
                          th:text="${photo.content}"
                          required></textarea>
            </div>

            <div class="form-group">
                <label>현재 사진</label>
                <img th:src="@{/uploads/{fileName}(fileName=${photo.savedName})}"
                     alt="현재 사진"
                     style="width:100%; max-height:260px; object-fit:contain; background:#111827; border-radius:12px;">
            </div>

            <div class="form-group">
                <label for="file">사진 변경</label>
                <input type="file"
                       id="file"
                       name="file"
                       accept="image/*">
            </div>

            <div class="form-actions">
                <a th:href="@{/photos/{id}(id=${photo.id})}" class="btn btn-outline">취소</a>
                <button type="submit" class="btn btn-primary">수정 완료</button>
            </div>
        </form>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
